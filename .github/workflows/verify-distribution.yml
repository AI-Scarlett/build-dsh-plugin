name: Verify distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  resolve-dsh-window:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.window.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve official DSH latest-three releases
        id: window
        run: node scripts/resolve-dsh-upgrade-matrix.mjs

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check

  dsh-compatibility:
    needs: resolve-dsh-window
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh-version: ${{ fromJSON(needs.resolve-dsh-window.outputs.releases) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install fixed DSH release in runner workspace
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
        run: npm install --prefix .runtime --ignore-scripts --no-audit --no-fund --no-save "@deepseek-ai/dsh@$DSH_VERSION"
        shell: bash
      - name: Verify this bundle in a disposable Profile
        run: node scripts/test-disposable-dsh-bundle.mjs .runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
        shell: bash
